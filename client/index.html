<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Socket.IO Rooms</title>
</head>

<body>

  <div class="container">

    <h1>Socket.IO Rooms</h1>

    <input
      id="roomInput"
      placeholder="Room ID"
    />

    <div class="buttons">
      <button id="createBtn">
        Create Room
      </button>

      <button id="joinBtn">
        Join Room
      </button>
    </div>

    <input
      id="messageInput"
      placeholder="Message"
    />

    <button id="sendBtn">
      Send
    </button>

    <ul id="messages"></ul>

  </div>

  <script
    type="module"
    src="/src/main.ts"
  ></script>

</body>
</html>
